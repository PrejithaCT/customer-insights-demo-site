<!DOCTYPE html>
<html>
<head>
    <title>Contact</title>

    <!-- Salesforce Interactions Web SDK -->
    <script src="https://cdn.c360a.salesforce.com/beacon/c360a/6fe98127-2f5c-4e89-a4a0-44fd9f536efd/scripts/c360a.min.js"></script>
</head>

<body>

    <h1>Contact Us</h1>

    <nav>
        <a href="index.html">Home</a> |
        <a href="books.html">Books</a> |
        <a href="mobiles.html">Mobiles</a> |
        <a href="contact.html">Contact</a>
    </nav>

    <h2>Submit Your Details</h2>

    <form id="contactForm">

        <label for="name">Name</label><br>
        <input
            type="text"
            id="name"
            name="name"
            required
        >
        <br><br>

        <label for="email">Email</label><br>
        <input
            type="email"
            id="email"
            name="email"
            required
        >
        <br><br>

        <button type="submit">
            Submit
        </button>

    </form>

    <p id="message"></p>

    <!-- Contact form Salesforce tracking -->
    <script src="script.js"></script>

</body>
</html>
